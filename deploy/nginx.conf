# Dashboard (statik) + benchmark API'lerine SSE-uyumlu reverse proxy.
# Docker'in dahili DNS'i (127.0.0.11) + degisken tabanli proxy_pass kullanilir; boylece
# bench konteynerleri henuz ayakta degilken bile nginx baslar.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Gelistirme sirasinda duzenlemeler aninda gorunsun
    location ~* \.(html|js|css|json|map)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # ---- .NET 10 ----
    location /bench10/ {
        set $upstream_bench10 http://bench10:8080;
        rewrite ^/bench10/(.*)$ /$1 break;
        proxy_pass $upstream_bench10;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        gzip off;
        add_header X-Accel-Buffering no always;
    }

    # ---- .NET 11 ----
    location /bench11/ {
        set $upstream_bench11 http://bench11:8080;
        rewrite ^/bench11/(.*)$ /$1 break;
        proxy_pass $upstream_bench11;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        gzip off;
        add_header X-Accel-Buffering no always;
    }
}
